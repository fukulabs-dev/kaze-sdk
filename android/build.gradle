// Built only as part of a React Native app, whose root project supplies the Android Gradle plugin,
// the Kotlin plugin, and the react-android version. Declaring our own versions here would conflict
// with the app's (e.g. Kotlin 2.x in current templates).
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}
android {
    namespace "dev.fukulabs.kaze"
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // Version comes from the app's React Native Gradle plugin.
    implementation("com.facebook.react:react-android")
}
