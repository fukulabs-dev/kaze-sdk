name: Release

# On every push to main, release-please keeps a "Release PR" up to date: it bumps package.json,
# updates CHANGELOG.md and .release-please-manifest.json from the conventional commits since the
# last release. Merging that PR tags the release, creates the GitHub release, and publishes to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install, test, build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      # Prerelease versions (e.g. 0.1.0-beta.1) go to their own dist-tag (beta) so they never become `latest`.
      - name: Publish package to npm
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          else
            DIST_TAG=latest
          fi
          echo "Publishing $VERSION with dist-tag $DIST_TAG"
          npm publish --access public --provenance --tag "$DIST_TAG" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
